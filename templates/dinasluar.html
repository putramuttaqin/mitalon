{% extends "base.html" %}

{% block title %}Perjalanan Dinas Luar{% endblock %}

{% block content %}
<div class="dl-page">
  <div class="form-wrapper shadow rounded">
    <h3 class="text-center mb-3">Dokumentasi Perjalanan Dinas</h3>

    <!-- Camera Section -->
    <div class="dl-camera">
      <!-- Live video -->
      <video id="video" autoplay playsinline></video>

      <!-- Canvas for captured frame -->
      <canvas id="canvas" class="hidden"></canvas>

      <!-- Overlay controls -->
      <div class="dl-overlay">
        <div class="dl-controls">
          <!-- Gallery -->
          <button id="dummyButton" class="dl-icon-btn" title="Buka Galeri">
            <img src="/static/images/gallery.png" alt="Gallery" />
          </button>

          <!-- Capture -->
          <button id="ambilFoto" class="dl-capture" title="Ambil Foto"></button>

          <!-- Switch Camera -->
          <button id="toggleCamera" class="dl-icon-btn" title="Ganti Kamera">
            <img src="/static/images/toggle.png" alt="Toggle Camera" />
          </button>
        </div>

        <!-- After capture: Foto Actions -->
        <div id="fotoActions" class="dl-actions hidden">
          <button id="fotoUlang" class="dl-btn dl-btn-secondary">Foto Ulang</button>
          <button id="downloadFoto" class="dl-btn dl-btn-success">Download</button>
        </div>
      </div>

      <!-- Zoom Controls (placed above the video) -->
      <div class="dl-zoom">
        <button class="zoom-btn" data-zoom="0.5">0.5×</button>
        <button class="zoom-btn" data-zoom="1">1×</button>
        <button class="zoom-btn" data-zoom="2">2×</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/dinasluar.js') }}?v=7"></script>
{% endblock %}
