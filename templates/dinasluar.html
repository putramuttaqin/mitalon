{% extends "base.html" %}

{% block title %}Perjalanan Dinas Luar{% endblock %}

{% block content %}
<div class="dark-mode">
  <div class="form-wrapper shadow rounded p-4">
    <h3 class="text-center mb-2">Dokumentasi Perjalanan Dinas</h3>

    <!-- Fullscreen camera -->
    <div class="camera-fullscreen">
      <video id="video" autoplay playsinline></video>
      <canvas id="canvas" class="hidden"></canvas>

      <!-- Overlay controls -->
      <div class="camera-overlay">
        <div class="control-row">
          <button id="toggleCamera" class="icon-btn">
            <img src="/static/images/toggle.png" alt="Toggle Camera" />
          </button>

          <button id="ambilFoto" class="capture-btn"></button>

          <button id="dummyButton" class="icon-btn">
            <img src="/static/images/gallery.png" alt="Switch" />
          </button>
        </div>

        <div id="fotoActions" class="foto-actions hidden">
          <button id="fotoUlang" class="btn btn-secondary">Foto Ulang</button>
          <button id="downloadFoto" class="btn btn-success">Download</button>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/dinasluar.js') }}?v=2"></script>
{% endblock %}
